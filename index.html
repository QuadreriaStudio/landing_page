<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quadreria Studio</title>
  <meta name="description" content="Quadreria Studio — launching soon.">
  <meta name="theme-color" content="#240000">

  <!-- Social share preview -->
  <meta property="og:title" content="Quadreria Studio">
  <meta property="og:description" content="Something is being curated. More details soon!">
  <meta property="og:url" content="https://quadreria.studio/">
  <meta property="og:type" content="website">

  <!-- Preload the font so the text doesn't flash -->
  <link rel="preload" href="assets/fonts/glacial-indifference-400.woff2" as="font" type="font/woff2" crossorigin>

  <style>
    /* Glacial Indifference — self-hosted (not available on Google Fonts) */
    @font-face {
      font-family: 'Glacial Indifference';
      src: url('assets/fonts/glacial-indifference-400.woff2') format('woff2'),
           url('assets/fonts/glacial-indifference-400.woff') format('woff');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --bg: #240000;
      --text: #f4f1ec;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Glacial Indifference', sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      position: relative;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    main {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 16px 8vh;
      animation: fadeIn 1.2s ease forwards;
      opacity: 0;
    }

    .logo {
      width: 50vw;
      max-width: 1100px;
      height: auto;
      display: block;
    }

    .launching {
      width: 30vw;
      max-width: 660px;
      height: auto;
      display: block;
      margin-top: 3.5vw;
    }

    .tagline {
      margin-top: 3.5vw;
      font-size: clamp(15px, 1.5vw, 30px);
      letter-spacing: 0.01em;
    }

    .email {
      position: absolute;
      right: 5.6vw;
      bottom: 6.5vw;
      font-size: clamp(15px, 1.5vw, 30px);
      color: var(--text);
      text-decoration: none;
    }

    .email:hover { text-decoration: underline; text-underline-offset: 4px; }

    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    /* Tablets & phones */
    @media (max-width: 768px) {
      main { padding-bottom: 120px; }
      .logo { width: 82vw; }
      .launching { width: 62vw; margin-top: 7vw; }
      .tagline { margin-top: 7vw; padding: 0 8px; }
      .email {
        right: 0;
        left: 0;
        bottom: 40px;
        text-align: center;
      }
    }
  </style>
</head>
<body>

  <main>
    <img src="assets/logo.png" alt="Quadreria Studio" class="logo">
    <img src="assets/launching-soon.gif" alt="Launching soon!" class="launching">
    <p class="tagline">Something is being curated. More details soon!</p>
  </main>

  <a class="email" href="mailto:hello@quadreria.studio">hello@quadreria.studio</a>

</body>
</html>
